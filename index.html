<!--
  ============================================================================
  SETUP (do this once before hosting on GitHub Pages / anywhere else):

  1. Go to https://console.firebase.google.com -> Add project (free tier is
     plenty). You don't need to enable Analytics.
  2. In the project: Build -> Firestore Database -> Create database ->
     start in TEST MODE (or set the rules below).
  3. Project settings (gear icon) -> General -> "Your apps" -> Web app (</>)
     -> register an app (no hosting needed) -> copy the firebaseConfig
     object it gives you and paste it over FIREBASE_CONFIG below.
  4. In Firestore -> Rules, use this (open, no login required — fine for a
     casual party game with no sensitive data):

       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           match /{document=**} {
             allow read, write: if true;
           }
         }
       }

  5. Push this file to a GitHub repo, enable GitHub Pages on it, done —
     anyone with the page URL can create/join rooms, no account needed.
  ============================================================================
-->

<style>
  :root{
    --bg: #0B2A20;
    --bg-elev: #0F3B2B;
    --bg-elev-2: #123F2E;
    --line: #EDEAE0;
    --line-soft: rgba(237,234,224,0.62);
    --line-faint: rgba(237,234,224,0.16);
    --gold: #D6A93B;
    --gold-ink: #2A2007;
    --red: #C23B3B;
    --red-ink: #FBECEC;
    --focus: #6FCF97;
    --radius: 7px;
  }
  :root:not([data-theme="light"]){ color-scheme: dark; }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      /* keep pitch theme even in light mode — it's the subject, not a UI chrome choice */
    }
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--line);
    font-family: "Work Sans", system-ui, sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }
  /* pitch markings, decorative */
  .pitch-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(circle at 50% 50%, transparent 0 118px, var(--line-faint) 118px 120px, transparent 120px),
      linear-gradient(var(--line-faint), var(--line-faint)) no-repeat 50% 50% / 100% 1px,
      radial-gradient(ellipse at 50% -10%, var(--bg-elev) 0%, var(--bg) 55%);
    background-position: 50% 42%, 50% 42%, 0 0;
  }
  .pitch-bg::before, .pitch-bg::after{
    content:""; position:absolute; top:42%; width:220px; height:340px;
    border: 1px solid var(--line-faint); transform: translateY(-50%);
  }
  .pitch-bg::before{ left:-110px; border-left:none; }
  .pitch-bg::after{ right:-110px; border-right:none; }

  #app{ position:relative; z-index:1; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding: 32px 18px 60px; }

  .wrap{ width:100%; max-width: 480px; margin-top: clamp(12px, 5vh, 56px); }

  .brand{ display:flex; align-items:baseline; gap:10px; justify-content:center; margin-bottom: 28px; }
  .brand .mark{ font-size: 28px; line-height:1; }
  .brand h1{
    font-family:"Oswald", sans-serif; font-weight:600; letter-spacing:0.01em;
    font-size: clamp(26px, 6vw, 34px); margin:0; color:var(--line);
  }
  .brand .sub{ font-family:"Oswald", sans-serif; font-weight:400; font-size:15px; color:var(--gold); margin-left:2px;}

  .panel{
    background: var(--bg-elev);
    border: 1px solid var(--line-faint);
    border-top: 3px solid var(--gold);
    border-radius: var(--radius);
    padding: 26px 24px;
    margin-bottom:16px;
  }
  .panel.danger{ border-top-color: var(--red); }

  h2{ font-family:"Oswald", sans-serif; font-weight:500; font-size:20px; margin: 0 0 6px; color:var(--line); }
  p.lead{ color:var(--line-soft); font-size:14.5px; line-height:1.5; margin: 0 0 20px; }

  label{ display:block; font-size:13px; color:var(--line-soft); margin-bottom:6px; }
  input[type=text]{
    width:100%; background: var(--bg-elev-2); border:1px solid var(--line-faint);
    color: var(--line); font-family:"Work Sans", sans-serif; font-size:16px;
    padding: 11px 13px; border-radius: 5px; outline:none;
  }
  input[type=text]::placeholder{ color: rgba(237,234,224,0.35); }
  input[type=text]:focus{ border-color: var(--focus); box-shadow: 0 0 0 3px rgba(111,207,151,0.18); }
  input.code-input{ font-family:"Oswald", sans-serif; letter-spacing: 0.28em; text-transform:uppercase; font-size:22px; text-align:center; }

  .field{ margin-bottom:16px; }
  .row{ display:flex; gap:10px; }
  .row > *{ flex:1; }

  button{
    font-family:"Work Sans", sans-serif; font-weight:600; font-size:15px;
    border-radius: 5px; border: none; padding: 12px 18px; cursor:pointer;
    transition: transform 0.06s ease, opacity 0.15s ease;
  }
  button:active{ transform: scale(0.98); }
  button:disabled{ opacity:0.45; cursor:not-allowed; }
  button.primary{ background: var(--gold); color: var(--gold-ink); width:100%; }
  button.primary:hover:not(:disabled){ opacity:0.92; }
  button.ghost{
    background: transparent; color: var(--line); border:1px solid var(--line-faint); width:100%;
  }
  button.ghost:hover:not(:disabled){ border-color: var(--line-soft); }
  button.danger{ background: var(--red); color: var(--red-ink); width:100%; }
  button.small{ width:auto; padding:8px 14px; font-size:13.5px; }

  .divider{ display:flex; align-items:center; gap:12px; margin: 22px 0; color:var(--line-soft); font-size:12.5px; }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background:var(--line-faint); }

  .code-display{
    font-family:"Oswald", sans-serif; font-size: clamp(38px, 11vw, 52px); letter-spacing:0.16em;
    text-align:center; color:var(--gold); margin: 4px 0 2px; font-weight:600;
  }
  .code-caption{ text-align:center; color:var(--line-soft); font-size:13px; margin-bottom:22px; }

  .player-list{ list-style:none; margin:0 0 20px; padding:0; display:flex; flex-direction:column; gap:8px; }
  .player-row{
    display:flex; align-items:center; gap:10px; padding:9px 11px;
    background: var(--bg-elev-2); border-radius:5px; border:1px solid var(--line-faint);
  }
  .avatar{
    width:30px; height:30px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-family:"Oswald",sans-serif; font-size:13px; font-weight:600; color:#0B2A20;
  }
  .p-name{ flex:1; font-size:14.5px; }
  .tag{ font-size:11px; padding:2px 7px; border-radius:20px; border:1px solid var(--line-faint); color:var(--line-soft); }
  .tag.host{ color:var(--gold-ink); background:var(--gold); border-color:var(--gold); }
  .tag.you{ color:var(--line); border-color:var(--line-soft); }

  .empty-note{ color:var(--line-soft); font-size:13.5px; text-align:center; padding: 10px 0 18px; }

  .role-card{
    text-align:center; padding: 40px 22px;
  }
  .role-card .kicker{ font-size:13px; color:var(--line-soft); margin-bottom:10px; }
  .role-card .big{ font-family:"Oswald", sans-serif; font-weight:600; font-size: clamp(28px, 8vw, 40px); line-height:1.15; }
  .role-card.imposter .big{ color: var(--red); }
  .role-card.crew .big{ color: var(--line); }
  .role-card .hint{ margin-top:14px; color:var(--line-soft); font-size:14px; line-height:1.55; }

  .clue-row{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line-faint); font-size:14.5px; }
  .clue-row:last-child{ border-bottom:none; }
  .clue-row .who{ color:var(--line-soft); }
  .clue-row .what{ font-weight:600; }

  .vote-grid{ display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .vote-btn{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background: var(--bg-elev-2); border:1px solid var(--line-faint); color:var(--line);
    text-align:left; width:100%; padding:11px 13px;
  }
  .vote-btn .count{ color:var(--gold); font-family:"Oswald",sans-serif; font-size:15px; }
  .vote-btn.selected{ border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }

  .status-strip{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:12.5px; color:var(--line-soft); margin-bottom:18px; text-align:center;
  }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); flex:none; }

  .result-banner{
    text-align:center; padding: 22px; border-radius: var(--radius);
    margin-bottom:18px; font-family:"Oswald",sans-serif; font-size:20px; font-weight:600;
  }
  .result-banner.crew-win{ background: rgba(111,207,151,0.14); border:1px solid var(--focus); color: var(--focus); }
  .result-banner.imposter-win{ background: rgba(194,59,59,0.14); border:1px solid var(--red); color: var(--red); }

  .waiting-note{
    text-align:center; color: var(--line-soft); font-size:14px; padding: 8px 0 4px;
  }

  .error-banner{
    background: rgba(194,59,59,0.15); border:1px solid var(--red); color: var(--red-ink);
    padding:10px 14px; border-radius:5px; font-size:13.5px; margin-bottom:16px;
  }

  .footer-note{ text-align:center; color: var(--line-faint); font-size:12px; margin-top: 14px; line-height:1.6; }
  a.linklike{ color: var(--gold); }

  .stack{ display:flex; flex-direction:column; gap:10px; }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>

  const AVATAR_PALETTE = ["#D6A93B","#6FCF97","#C23B3B","#7EA6C9","#B389D6","#E08E5C","#5FB0A6","#D98CB3"];

  function colorForId(id){
    let h = 0;
    for (let i=0;i<id.length;i++){ h = (h*31 + id.charCodeAt(i)) >>> 0; }
    return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
  }
  function initials(name){
    const parts = (name||"?").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }
  function makeRoomCode(){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no O/0, I/1
    let s = "";
    for (let i=0;i<4;i++) s += chars[Math.floor(Math.random()*chars.length)];
    return s;
  }
  function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function saveSession(){

  function getAnonId(){
    try{
      let id = localStorage.getItem("fi_anon_id");
      if (!id){
        id = "anon-" + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
        localStorage.setItem("fi_anon_id", id);

    }catch(e){ return "anon-" + Math.random().toString(36).slice(2,10); }
  }

  // ---------------------------------------------------------------------

  // ---------------------------------------------------------------------
  async function init(){
    render(); // initial shell so the page never looks blank

    try{
      if (!FIREBASE_CONFIG || FIREBASE_CONFIG.apiKey === "PASTE_YOUR_API_KEY_HERE"){
        throw new Error("Firebase isn't configured yet.");
      }
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
    }catch(e){
      db = null;
      state.error = "This page needs a Firebase project connected before it can host games — see the setup comment near the top of the HTML file.";
    }

    state.dbAvailable = !!db;

    // No login system here — every visitor just gets a private random id
    // stored in their own browser, so they can rejoin the same room on
    // reload but nobody else can impersonate them.
    state.myId = getAnonId();

    state.ready = true;

    const sess = loadSession();
    if (sess && sess.roomCode){
      state.myName = sess.name || state.nameDraft;
      await rejoinRoom(sess.roomCode);
    }
    render();
  }

  // ---------------------------------------------------------------------
  // Room operations
  // ---------------------------------------------------------------------
  async function createRoom(name){
    if (!db){ state.error = "Multiplayer isn't available in this view."; render(); return; }
    state.error = null;
    let code, roomRef, snap;
    for (let attempt=0; attempt<8; attempt++){
      code = makeRoomCode();
      roomRef = db.doc("rooms/" + code);
      try{
        snap = await roomRef.get();
      }catch(e){ state.error = "Couldn't reach the game server. Try again."; render(); return; }
      if (!snap.exists) break;
      roomRef = null;
    }
    if (!roomRef){ state.error = "Couldn't find a free room code — try again."; render(); return; }

    try{
      await roomRef.set({
        hostId: state.myId,
        status: "lobby",
        round: 0,
        footballer: null,
        imposterId: null,
        createdAt: Date.now(),
      });
      await roomRef.collection("players").doc(state.myId).set({
        name: name, joinedAt: Date.now(),
      });
    }catch(e){
      state.error = "Couldn't create the room. Try again.";
      render();
      return;
    }
    state.myName = name;
    state.roomCode = code;
    saveSession();
    subscribeToRoom(code);
  }

  async function joinRoom(code, name){
    if (!db){ state.error = "Multiplayer isn't available in this view."; render(); return; }
    code = (code||"").trim().toUpperCase();
    if (!code){ state.error = "Enter a room code."; render(); return; }
    state.error = null;
    const roomRef = db.doc("rooms/" + code);
    let snap;
    try{
      snap = await roomRef.get();
    }catch(e){ state.error = "Couldn't reach the game server. Try again."; render(); return; }
    if (!snap.exists){
      state.error = "No room with that code. Double-check with your host.";
      render();
      return;
    }
    try{
      await roomRef.collection("players").doc(state.myId).set({
        name: name, joinedAt: Date.now(),
      });
    }catch(e){
      state.error = "Couldn't join — you may not have access to this room's workspace.";
      render();
      return;
    }
    state.myName = name;
    state.roomCode = code;
    saveSession();
    subscribeToRoom(code);
  }

  async function rejoinRoom(code){
    if (!db) return;
    const roomRef = db.doc("rooms/" + code);
    try{
      const snap = await roomRef.get();
      if (!snap.exists){ clearSession(); return; }
    }catch(e){ return; }
    state.roomCode = code;
    subscribeToRoom(code);
  }

  function subscribeToRoom(code){
    clearSubs();
    state.screen = "lobby";
    const roomRef = db.doc("rooms/" + code);

    unsubRoom = roomRef.onSnapshot(snap => {
      if (!snap.exists){
        state.error = "This room no longer exists.";
        leaveRoom(false);
        return;
      }
      state.room = snap.data();
      render();
    }, err => {
      state.error = "Lost connection to the room.";
      render();
    });

    unsubPlayers = roomRef.collection("players").orderBy("joinedAt", "asc").onSnapshot(snap => {
      state.players = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      render();
    });

    unsubClues = roomRef.collection("clues").onSnapshot(snap => {
      const map = {};
      snap.docs.forEach(d => { map[d.id] = d.data(); });
      state.clues = map;
      render();
    });

    unsubVotes = roomRef.collection("votes").onSnapshot(snap => {
      const map = {};
      snap.docs.forEach(d => { map[d.id] = d.data(); });
      state.votes = map;
      state.myVote = (map[state.myId] && map[state.myId].votedFor) || null;
      render();
    });
  }

  async function leaveRoom(clearData){
    clearSubs();
    if (clearData !== false && db && state.roomCode && state.myId){
      try{
        await db.doc("rooms/" + state.roomCode).collection("players").doc(state.myId).delete();
      }catch(e){}
    }
    state.roomCode = null;
    state.room = null;
    state.players = [];
    state.clues = {};
    state.votes = {};
    state.myVote = null;
    state.screen = "landing";
    clearSession();
    render();
  }

  function isHost(){
    if (!state.room) return false;
    if (state.room.hostId === state.myId) return true;
    // host fallback: if the recorded host has left, the earliest-joined remaining player may act as host
    const hostStillHere = state.players.some(p => p.id === state.room.hostId);
    if (hostStillHere) return false;
    if (!state.players.length) return false;
    return state.players[0].id === state.myId;
  }

  // ---------------------------------------------------------------------
  // Game actions (host-gated)
  // ---------------------------------------------------------------------
  // Picks the footballer, imposter, the starting player, and which one of
  // the footballer's two hints the imposter secretly gets, then writes the
  // whole round setup to the room doc in one go.
  async function beginRound(){
    if (!isHost() || state.players.length < 3) return;
    const footballer = pickRandom(FOOTBALLERS);
    const imposterId = pickRandom(state.players).id;
    const starterId = pickRandom(state.players).id; // anyone can start, imposter included
    const hintForImposter = pickRandom(footballer.hints);
    const round = (state.room.round || 0) + 1;
    try{
      await db.doc("rooms/" + state.roomCode).update({
        status: "reveal",
        footballer: footballer.name,
        imposterId, starterId, hintForImposter, round,
      });
    }catch(e){ state.error = "Couldn't start the round."; render(); }
  }
  const startGame = beginRound;
  const newRound = beginRound;

  async function setPhase(phase){
    if (!isHost()) return;
    try{
      await db.doc("rooms/" + state.roomCode).update({ status: phase });
    }catch(e){ state.error = "Couldn't update the game."; render(); }
  }

  async function endToLobby(){
    if (!isHost()) return;
    try{
      await db.doc("rooms/" + state.roomCode).update({ status: "lobby" });
    }catch(e){}
  }

  async function submitClue(text){
    text = (text||"").trim();
    if (!text) return;
    try{
      await db.doc("rooms/" + state.roomCode).collection("clues").doc(state.myId).set({
        clue: text.slice(0, 60), round: state.room.round, name: state.myName,
      });
    }catch(e){ state.error = "Couldn't submit your clue."; render(); }
  }

  async function castVote(targetId){
    try{
      await db.doc("rooms/" + state.roomCode).collection("votes").doc(state.myId).set({
        votedFor: targetId, round: state.room.round,
      });
    }catch(e){ state.error = "Couldn't cast your vote."; render(); }
  }

  // ---------------------------------------------------------------------
  // Render helpers
  // ---------------------------------------------------------------------
  function playersMap(){
    const m = {};
    state.players.forEach(p => m[p.id] = p);
    return m;
  }

  function currentRoundClues(){
    const out = [];
    Object.keys(state.clues).forEach(pid => {
      const c = state.clues[pid];
      if (c && state.room && c.round === state.room.round) out.push(Object.assign({ id: pid }, c));
    });
    return out;
  }

  function currentRoundVotes(){
    const out = {};
    Object.keys(state.votes).forEach(pid => {
      const v = state.votes[pid];
      if (v && state.room && v.round === state.room.round) out[pid] = v.votedFor;
    });
    return out;
  }

  function tally(){
    const counts = {};
    const votes = currentRoundVotes();
    Object.values(votes).forEach(target => { counts[target] = (counts[target]||0) + 1; });
    return counts;
  }

  // ---------------------------------------------------------------------
  // Screens
  // ---------------------------------------------------------------------
  function screenLanding(){
    return `
      <div class="wrap">
        <div class="brand">
          <span class="mark">⚽</span>
          <h1>Football Imposter</h1>
        </div>
        ${state.error ? `<div class="error-banner">${escapeHtml(state.error)}</div>` : ""}
        <div class="panel">
          <h2>Your name</h2>
          <p class="lead">This is what your teammates will see at the table.</p>
          <div class="field">
            <input type="text" id="nameInput" placeholder="e.g. Sam" value="${escapeHtml(state.nameDraft)}" maxlength="24" />
          </div>
        </div>

        <div class="panel">
          <h2>Start a game</h2>
          <p class="lead">Create a room and share the code with friends.</p>
          <button class="primary" id="createBtn">Create a room</button>
        </div>

        <div class="divider">or join a friend's room</div>

        <div class="panel">
          <h2>Join a game</h2>
          <div class="field">
            <input type="text" id="joinCodeInput" class="code-input" placeholder="CODE" maxlength="4" value="${escapeHtml(state.joinCodeDraft)}" />
          </div>
          <button class="ghost" id="joinBtn">Join room</button>
        </div>

        <p class="footer-note">One player secretly doesn't know the footballer. Everyone else does. Give one-word clues, discuss, then vote out the imposter — before they blend in and win.${state.dbAvailable ? "" : " Multiplayer isn't connected yet on this copy of the page."}</p>
      </div>
    `;
  }

  function screenLobby(){
    const room = state.room;
    if (!room) return `<div class="wrap"><div class="panel"><p class="lead">Loading room…</p></div></div>`;
    const host = isHost();
    const canStart = host && state.players.length >= 3;

    return `
      <div class="wrap">
        <div class="brand">
          <span class="mark">⚽</span>
          <h1>Football Imposter</h1>
        </div>
        ${state.error ? `<div class="error-banner">${escapeHtml(state.error)}</div>` : ""}

        <div class="panel">
          <div class="code-display">${escapeHtml(state.roomCode)}</div>
          <div class="code-caption">Share this code — friends join from the same page.</div>

          <h2>Players (${state.players.length})</h2>
          <ul class="player-list">
            ${state.players.map(p => `
              <li class="player-row">
                <div class="avatar" style="background:${colorForId(p.id)}">${escapeHtml(initials(p.name))}</div>
                <div class="p-name">${escapeHtml(p.name || "Player")}</div>
                ${p.id === room.hostId ? '<span class="tag host">Host</span>' : ""}
                ${p.id === state.myId ? '<span class="tag you">You</span>' : ""}
              </li>
            `).join("")}
          </ul>
          ${state.players.length < 3 ? `<p class="empty-note">Need at least 3 players to start.</p>` : ""}

          ${host
            ? `<button class="primary" id="startBtn" ${canStart ? "" : "disabled"}>Start game</button>`
            : `<p class="waiting-note">Waiting for the host to start the game…</p>`
          }
        </div>

        <button class="ghost" id="leaveBtn">Leave room</button>
      </div>
    `;
  }

  function screenGame(){
    const room = state.room;
    const host = isHost();
    const pmap = playersMap();
    const me = pmap[state.myId];

    let body = "";

    const starterName = (pmap[room.starterId] && pmap[room.starterId].name) || null;
    const starterBanner = starterName
      ? `<div class="status-strip"><span class="dot"></span>${escapeHtml(starterName)} goes first this round</div>`
      : "";

    if (room.status === "reveal"){
      const amImposter = room.imposterId === state.myId;
      body = `
        <div class="panel role-card ${amImposter ? "imposter" : "crew"}">
          <div class="kicker">Round ${room.round}</div>
          ${amImposter
            ? `<div class="big">You're the Imposter</div>
               <div class="hint">Everyone else has been shown a famous footballer. You haven't — but here's one clue about them to help you bluff:</div>
               <div class="big" style="font-size:20px; margin-top:10px; color:var(--gold);">${escapeHtml(room.hintForImposter || "")}</div>`
            : `<div class="big">${escapeHtml(room.footballer)}</div>
               <div class="hint">That's the footballer. One person at the table doesn't know it — figure out who, without giving it away too easily.</div>`
          }
        </div>
        ${starterBanner}
        ${host
          ? `<button class="primary" id="advanceBtn">Everyone's seen their role — start clues</button>`
          : `<p class="waiting-note">Waiting for the host to move on once everyone's seen their role…</p>`
        }
      `;
    } else if (room.status === "clues"){
      const clues = currentRoundClues();
      const mine = clues.find(c => c.id === state.myId);
      body = `
        ${starterBanner}
        <div class="panel">
          <h2>Give a one-word clue</h2>
          <p class="lead">Something true about the footballer — vague enough that the imposter can't guess the name from it alone.</p>
          <div class="field row">
            <input type="text" id="clueInput" placeholder="e.g. Ballon d'Or" maxlength="60" value="${escapeHtml(mine ? mine.clue : "")}" />
            <button class="primary small" id="clueBtn" style="flex:0 0 auto;">${mine ? "Update" : "Submit"}</button>
          </div>
          ${clues.length
            ? clues.map(c => `
                <div class="clue-row">
                  <span class="who">${escapeHtml((pmap[c.id] && pmap[c.id].name) || c.name || "Player")}</span>
                  <span class="what">${escapeHtml(c.clue)}</span>
                </div>
              `).join("")
            : `<p class="empty-note">No clues yet.</p>`
          }
        </div>
        ${host
          ? `<button class="primary" id="advanceBtn">Move to discussion</button>`
          : `<p class="waiting-note">Waiting for the host to move to discussion…</p>`
        }
      `;
    } else if (room.status === "discuss"){
      body = `
        <div class="panel">
          <h2>Discuss</h2>
          <p class="lead">Talk it through out loud — who gave a shaky clue? Who seemed like they were guessing?</p>
          ${currentRoundClues().length
            ? currentRoundClues().map(c => `
                <div class="clue-row">
                  <span class="who">${escapeHtml((pmap[c.id] && pmap[c.id].name) || c.name || "Player")}</span>
                  <span class="what">${escapeHtml(c.clue)}</span>
                </div>
              `).join("")
            : ""
          }
        </div>
        ${host
          ? `<button class="primary" id="advanceBtn">Start voting</button>`
          : `<p class="waiting-note">Waiting for the host to open voting…</p>`
        }
      `;
    } else if (room.status === "voting"){
      const votes = currentRoundVotes();
      const counts = tally();
      body = `
        <div class="panel">
          <h2>Vote out the imposter</h2>
          <p class="lead">Pick who you think doesn't know the footballer.</p>
          <div class="vote-grid">
            ${state.players.map(p => `
              <button class="vote-btn ${state.myVote === p.id ? "selected" : ""}" data-vote="${p.id}">
                <span>${escapeHtml(p.name)}${p.id === state.myId ? " (you)" : ""}</span>
                <span class="count">${counts[p.id] || 0}</span>
              </button>
            `).join("")}
          </div>
          <div class="status-strip"><span class="dot"></span>${Object.keys(votes).length} of ${state.players.length} voted</div>
        </div>
        ${host
          ? `<button class="primary" id="advanceBtn">Reveal results</button>`
          : `<p class="waiting-note">Waiting for the host to reveal results…</p>`
        }
      `;
    } else if (room.status === "results"){
      const counts = tally();
      let topId = null, topCount = -1, tie = false;
      Object.keys(counts).forEach(id => {
        if (counts[id] > topCount){ topCount = counts[id]; topId = id; tie = false; }
        else if (counts[id] === topCount){ tie = true; }
      });
      const caught = topId === room.imposterId && topCount > 0 && !tie;
      const imposterName = (pmap[room.imposterId] && pmap[room.imposterId].name) || "The imposter";
      body = `
        <div class="result-banner ${caught ? "crew-win" : "imposter-win"}">
          ${caught ? "The imposter was caught!" : (tie ? "It was a tie — the imposter slips away." : "The imposter got away with it.")}
        </div>
        <div class="panel">
          <h2>${escapeHtml(imposterName)} was the imposter</h2>
          <p class="lead">The footballer was <strong style="color:var(--line)">${escapeHtml(room.footballer)}</strong>.</p>
          <div class="vote-grid">
            ${state.players.map(p => `
              <div class="vote-btn" style="cursor:default;">
                <span>${escapeHtml(p.name)}${p.id === room.imposterId ? " — imposter" : ""}</span>
                <span class="count">${counts[p.id] || 0} vote${(counts[p.id]||0) === 1 ? "" : "s"}</span>
              </div>
            `).join("")}
          </div>
        </div>
        ${host
          ? `<div class="stack">
               <button class="primary" id="newRoundBtn" ${state.players.length < 3 ? "disabled" : ""}>Play another round</button>
               <button class="ghost" id="lobbyBtn">Back to lobby</button>
             </div>`
          : `<p class="waiting-note">Waiting for the host to start another round…</p>`
        }
      `;
    } else {
      body = `<div class="panel"><p class="lead">Loading…</p></div>`;
    }

    return `
      <div class="wrap">
        <div class="brand">
          <span class="mark">⚽</span>
          <h1>Football Imposter</h1>
          <span class="sub">${escapeHtml(state.roomCode)}</span>
        </div>
        ${state.error ? `<div class="error-banner">${escapeHtml(state.error)}</div>` : ""}
        ${body}
        <button class="ghost" id="leaveBtn" style="margin-top:6px;">Leave room</button>
      </div>
    `;
  }

  // ---------------------------------------------------------------------
  // Main render
  // ---------------------------------------------------------------------
  function render(){
    const app = document.getElementById("app");
    if (!state.ready){
      app.innerHTML = `<div class="wrap"><div class="brand"><span class="mark">⚽</span><h1>Football Imposter</h1></div><p class="lead" style="text-align:center;">Loading…</p></div>`;
      return;
    }

    let html;
    if (!state.roomCode || !state.room){
      html = screenLanding();
    } else if (state.room.status === "lobby"){
      html = screenLobby();
    } else {
      html = screenGame();
    }
    app.innerHTML = html;
    attachHandlers();
  }

  function attachHandlers(){
    const nameInput = document.getElementById("nameInput");
    if (nameInput){
      nameInput.addEventListener("input", e => { state.nameDraft = e.target.value; });
    }
    const joinCodeInput = document.getElementById("joinCodeInput");
    if (joinCodeInput){
      joinCodeInput.addEventListener("input", e => { state.joinCodeDraft = e.target.value.toUpperCase(); });
    }
    const createBtn = document.getElementById("createBtn");
    if (createBtn){
      createBtn.addEventListener("click", () => {
        const name = (state.nameDraft || "").trim();
        if (!name){ state.error = "Enter your name first."; render(); return; }
        createRoom(name);
      });
    }
    const joinBtn = document.getElementById("joinBtn");
    if (joinBtn){
      joinBtn.addEventListener("click", () => {
        const name = (state.nameDraft || "").trim();
        if (!name){ state.error = "Enter your name first."; render(); return; }
        joinRoom(state.joinCodeDraft, name);
      });
    }
    const leaveBtn = document.getElementById("leaveBtn");
    if (leaveBtn){
      leaveBtn.addEventListener("click", () => leaveRoom(true));
    }
    const startBtn = document.getElementById("startBtn");
    if (startBtn){
      startBtn.addEventListener("click", startGame);
    }
    const advanceBtn = document.getElementById("advanceBtn");
    if (advanceBtn && state.room){
      const next = { reveal: "clues", clues: "discuss", discuss: "voting", voting: "results" }[state.room.status];
      if (next) advanceBtn.addEventListener("click", () => setPhase(next));
    }
    const clueBtn = document.getElementById("clueBtn");
    if (clueBtn){
      clueBtn.addEventListener("click", () => {
        const val = document.getElementById("clueInput").value;
        submitClue(val);
      });
    }
    document.querySelectorAll("[data-vote]").forEach(btn => {
      btn.addEventListener("click", () => castVote(btn.getAttribute("data-vote")));
    });
    const newRoundBtn = document.getElementById("newRoundBtn");
    if (newRoundBtn){ newRoundBtn.addEventListener("click", newRound); }
    const lobbyBtn = document.getElementById("lobbyBtn");
    if (lobbyBtn){ lobbyBtn.addEventListener("click", endToLobby); }
  }

  init();
})();
</script>
</body>
</html>
